<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Team Picker</title>
<style>
body{font-family:Arial;background:#eef2ff;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:30px;border-radius:16px}
textarea,input{width:100%;padding:13px;box-sizing:border-box;margin:10px 0;border:1px solid #a5b4fc;border-radius:8px}
textarea{height:170px}
button{background:#4f46e5;color:white;padding:14px 20px;border:0;border-radius:8px;cursor:pointer}
.team{background:#e0e7ff;padding:20px;margin-top:15px;border-radius:10px;white-space:pre-line;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>Random Team Picker</h1>
<p>Divide participants into randomized teams.</p>
<textarea id="names" placeholder="Enter one name per line"></textarea>
<label>Number of Teams</label>
<input id="count" type="number" min="2" value="2">
<button onclick="generate()">Generate Teams</button>
<div id="teams"></div>
</main>
<script>
function generate(){
 const names=document.getElementById("names").value
 .split(/\r?\n/).map(n=>n.trim()).filter(Boolean);
 const count=Number(document.getElementById("count").value);
 const area=document.getElementById("teams");
 area.innerHTML="";
 if(!Number.isInteger(count)||count<2||count>names.length){
  area.textContent="Enter enough participants and a valid team count.";
  return;
 }
 for(let i=names.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [names[i],names[j]]=[names[j],names[i]];
 }
 const teams=Array.from({length:count},()=>[]);
 names.forEach((name,i)=>teams[i%count].push(name));
 teams.forEach((team,i)=>{
  const item=document.createElement("div");
  item.className="team";
  item.textContent="Team "+(i+1)+"\n\n"+team.join("\n");
  area.appendChild(item);
 });
}
</script>
</body>
</html>
