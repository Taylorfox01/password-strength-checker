<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Strength Checker</title>
<style>
body{font-family:Arial;background:#fff1f2;padding:25px}
main{max-width:500px;margin:auto;background:white;padding:25px;border-radius:15px}
input{width:100%;padding:13px;box-sizing:border-box;margin:12px 0}
#bar{height:12px;background:#e5e7eb;border-radius:10px;overflow:hidden}
#fill{height:100%;width:0;background:#ef4444;transition:.2s}
#result{padding:15px;background:#fce7f3;margin-top:15px;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>Password Strength Checker</h1>
<input id="password" type="password" placeholder="Enter a password">
<div id="bar"><div id="fill"></div></div>
<div id="result">Enter a password to analyze it.</div>
</main>
<script>
function analyze(){
 const p=document.getElementById("password").value;
 const result=document.getElementById("result");
 let score=0;
 if(p.length>=8)score++;
 if(p.length>=12)score++;
 if(/[a-z]/.test(p)&&/[A-Z]/.test(p))score++;
 if(/[0-9]/.test(p))score++;
 if(/[^a-zA-Z0-9]/.test(p))score++;
 const labels=["Very Weak","Weak","Fair","Good","Strong","Very Strong"];
 const colors=["#ef4444","#f97316","#eab308","#84cc16","#22c55e","#15803d"];
 document.getElementById("fill").style.width=(score/5*100)+"%";
 document.getElementById("fill").style.background=colors[score];
 result.textContent=p?labels[score]+" — "+score+"/5 checks passed":"Enter a password to analyze it.";
}
document.getElementById("password").addEventListener("input",analyze);
</script>
</body>
</html>
